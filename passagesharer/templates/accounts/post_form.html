{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if editing %}Edit passage{% else %}Post{% endif %}</title>
    <link rel="stylesheet" href="{% static 'global/css/style.css' %}">
    <link rel="shortcut icon" href="{% static 'global/icon/favicon.ico' %}" type="image/x-icon">
    <script src="{% static 'global/js/change_colormode.js' %}"></script>
</head>
<body>
    <div class="center_temp" style="width: 520px;">
        <h2>{% if editing %}Edit passage{% else %}Post{% endif %}</h2>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <!-- <label for="id_title">Title:</label> -->
                {{ form.title }}
                {{ form.title.errors }}
            </div>
            
            <div class="form-group">
                <!-- <label for="id_content">Content:</label> -->
                {{ form.content }}
                {{ form.content.errors }}
            </div>
            
            <button type="submit">{% if editing %}Update{% else %}Publish{% endif %}</button>
        </form>

        <a href="{% url 'accounts:dashboard' %}" class="back-btn">Back to dashboard</a>
        <a class="colormode_link">
            <button class="change_colormode_button">
                <img></img>
            </button>
        </a>
    </div>
</body>
</html>
