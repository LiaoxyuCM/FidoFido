{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if editing %}Edit passage{% else %}Post{% endif %}</title>
    <link rel="stylesheet" href="{% static 'global/css/style.css' %}">
</head>
<body>
    <div class="main">
        <h2>{% if editing %}Edit passage{% else %}Post{% endif %}</h2>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <p>Title</p>
                <!-- <label for="id_title">Title:</label> -->
                {{ form.title }}
                {{ form.title.errors }}
            </div>
            
            <div class="form-group">
                <p>Content (Markdown supported)</p>
                <!-- <label for="id_content">Content:</label> -->
                {{ form.content }}
                {{ form.content.errors }}
            </div>
            
            <button type="submit">{% if editing %}Update{% else %}Publish{% endif %}</button>
        </form>

        <a href="{% url 'accounts:dashboard' %}" class="back-btn">Back to dashboard</a>
    </div>
</body>
</html>
